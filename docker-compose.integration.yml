services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: cerno_test
      POSTGRES_USER: cerno_test
      POSTGRES_PASSWORD: cerno_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerno_test -d cerno_test"]
      interval: 2s
      timeout: 5s
      retries: 20

